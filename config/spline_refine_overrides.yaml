# Overrides for the spline branch, layered on top of a dataset config.
#
# Restructured 2026-09-02 to the nested/mode shape -- see
# config/spline_adaptive_q.yaml for the full commentary and
# include/livo_recon/utils/log/config_resolve.h for the contract.  A key set
# into a scope that cannot read it now REFUSES at startup instead of being
# silently dropped.

spline:
  # See config/spline_adaptive_q.yaml for the full commentary.  raw_imu |
  # spline | spline+refine, replacing enable + per_iteration (5) +
  # boundary_anchor_mode (3).  THIS is the ablation axis for anything
  # touching the per-iteration pipeline; do not reintroduce booleans.
  #
  # Rotation is always the cumulative form now -- the tangent arm is gone.
  # SP-4a"/4b" measured cumulative beating tangent on BOTH arms on exp05
  # (0.277 vs 0.334 m debiased, 0.351 vs 0.428 m pca), which is 17-20% and
  # sits AT T0-G's 18.88% bar rather than clear of it: consistent-direction
  # evidence on two arms, not a measured margin.  The removal rests on it
  # being the published form, not on that number.
  mode: spline+refine

  control_points:
    hz: 100.0

  # refine:
  #   iters: 1

  log_en: true

voxel_map:
  plane:
    weight_floor:
      mode: sensor_range
