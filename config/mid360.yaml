# mid360: single, fully self-contained livo_recon config file.
# 2026-08-16: consolidated from config/defaults/*.yaml + config/mid360/*.yaml
# (the old defaults/dataset-override split across ~10-13 per-topic files
# each) into one file per dataset -- every option this dataset actually
# runs with lives here, nothing implicit from a separate defaults/ layer.
# Loaded via a single <rosparam file> in launch/livo_recon_mid360.launch,
# followed by overrides_file (test-only escape hatch, still separate).
# Merge verified byte-exact against the old multi-file load via a
# rosparam-dump diff before the old files were removed -- see
# VIO_METHODOLOGY_DIFF.md or task #292 if this history matters.

cuda:
  enable: false  # set true to dispatch H^T*W*H accumulation (LIO) and affine warp (VIO) to GPU
viz:
  enable: true  # normally overridden by the launch file's viz/enable param, set directly from the rviz:= launch arg (see livo_recon_*.launch) -- this default only applies if that param load is bypassed, e.g. loading this file's params directly outside a launch file
  plane_map: false
  uv_tracking: true  # publish rgb_img with arrows showing vio's tracked uv displacements
  ds:
    # 0.0 disables visualization downsampling entirely (publishCloud()'s own
    # do_ds = vis_ds_leaf_size > 0.0 check) -- every camera-frame-projected
    # point is published, not just the first one seen per 5cm voxel.
    ds_leaf_size: 0.0
# R97A Q5: outputs/auto_terminate_* moved to run/*; outputs/profiler/export_path and outputs/printer/* moved to log/* (see
# r97a_inputs/log_key_map.tsv). outputs/path, outputs/pcd/*, outputs/image/* stay (they are outputs).
run:
  # Self-shutdown for headless/scripted test runs: once popMeasureGroup()
  # has come back empty for auto_terminate_idle_secs real (wall-clock)
  # seconds straight, LivoReconNode::run() exits its own loop cleanly
  # instead of idling forever. Enabled by default so test_common.sh's
  # run_one() (and any other headless launcher) can just wait() on the
  # process rather than guessing "is it done" from a stall heuristic on
  # console output, which misfires on GPU-bound VIO frontends (can go
  # quiet for seconds at a time mid-frame while blocked on a GPU kernel).
  auto_terminate_on_idle: true
  auto_terminate_idle_secs: 5.0
log:
  profiler_path: "/tmp/livo_recon_profile.txt"
  printer:
    # params/calib default to true (matching Printer's own C++ constructor
    # default) so load-confirmation output -- tracker backend load status
    # in particular -- is actually visible in a normal run's console log.
    # Confirmed 2026-08-12: this default being false meant NOTHING from
    # loadParameters() across every subsystem (including a successful/
    # failed tracker load) ever printed, making a real investigation (does
    # the tracker actually load, what did calib produce) impossible without
    # first discovering and overriding this flag by hand.
    params: true
    voxel: false
    state: false
    calib: true
    vio: false
    lio: false
    evo: true
    profiler: false
    throttle_s: 0.
  vio:
    iterations: false
    point_residuals: false
    residual_counts: false
    raw_tracker_output: false
    norm_l_low_frac: 0.3
    # path deliberately NOT set here -- letting VioProc::loadParameters()'s
    # own C++ default (debugLogPath("livo_recon_myvio_log.txt"), see
    # utils/log/debug_log_dir.h) apply. A hardcoded "/tmp/..." string here
    # would always win (rosparam values set by a <rosparam file> load take
    # precedence over a pnh.param() call's C++ default, which is only a
    # fallback for keys never set on the server at all) and silently defeat
    # log/dir regardless of what it's set to.
outputs:
  path: "/root/catkin_ws/Log"          # base directory for COLMAP dataset export (empty = disabled)
  pcd:
    export: false   # accumulate and write sparse/0/points3D.bin on shutdown
  image:
    export: false   # save images to images/ and write cameras.bin + images.bin on shutdown
    interval: 1     # export every N-th frame (must be >= 1)
calib:
  stationary:
    # 2026-10-20 (Bryce's call): num_samples removed, num_frames is the only stop condition now.
    # Converted from the old num_samples=100 using this device's own measured rates (capture_10_20_no2.bag:
    # image ~10.0Hz, IMU ~200.9Hz -> ~20.1 IMU samples/frame) -- a straightforward unit conversion.
    num_frames: 5
# R97A Q4: calib/stationary/stall_calls_max, apply_to_state/*, state/est/{bg,ba,gravity}, state/cov/{rot_tilt,rot_yaw,pos,vel,bg,ba},
# and state/init_state/{vel,ba,bg} are removed. state/cov/gravity and state/init_state/gravity are kept.
state:
  cov:
    gravity: 1.0e-5
  init_state:
    gravity: [0., 0., -9.81]
imu:
  process_noise:
    # 2026-10-20: mid360's own first pass -- model isotropic (not fixed, so fixed/{acc,gyro}_variance
    # below are dropped as unused), same beta as ntu_viral; acc_scale/gyro_scale start at ntu_viral's
    # own tuned values but are the planned sweep variable for this sensor, not assumed correct yet.
    model: isotropic
    motion:
      beta: 0.9
      acc_scale: 0.15
      gyro_scale: 10.0
      # Bryce's explicit call, with the R97A Q3-fix divergence risk acknowledged: cap removed
      # entirely (<= 0 disables clamping, see imu_processing.h/.cpp's 2026-10-20 comments) rather
      # than set to a large finite stand-in.
      acc_max_dynamic_variance: -1.0
      gyro_max_dynamic_variance: -1.0
    bias_random_walk:
      gyro_variance_rate: 1.0e-5
      accel_variance_rate: 1.0e-5
  second_order: true   # include dt² Jacobian terms F_x[P,R] and F_x[P,G]
  sensor:
    # 2026-10-20: Livox Mid-360 datasheet (livoxtech.com/mid-360/specs): range precision (1σ)
    # <= 2cm (range_err, already correct before this comment -- coincided with the generic
    # default), angular precision (1σ) < 0.15° (angle_err_deg, also already the generic
    # fallback value -- now set explicitly and cited rather than left implicit).
    range_err: 0.02
    angle_err_deg: 0.15
  ds:
    # Downsampling off. Written as the mode rather than as ds_leaf_size:
    # 0.0, a sentinel that also left imu/ds/mode inert.
    mode: "off"
lio:
  ekf:
    # R97A Q2: min_norm_dtheta/min_norm_dt/min_diff_error are removed (this yaml previously set
    # non-zero values, a real behavior change -- flagged in REPORT.md).
    max_iterations: 5
voxel_map:
  # 2026-10-20: copied from ntu_viral (not yet separately tuned for mid360).
  binned:
    bin_size_fraction: 0.25   # bin edge = this x the node's own edge
    cov_mode: average         # average (C / k) | shrunk (C / k^2)
  map:
    voxel_size: 0.425  # 2026-10-20: starting point, ntu_viral/HILTI's shared tuned value
    max_layer: 2
  plane:
    plane_threshold: 2.5e-3
    # 2026-10-20: copied from ntu_viral (not yet separately tuned for mid360).
    line_residual:
      form: hard
      rule: absolute
      rows: per_normal
      variance: plane_equivalent
  points:
    min_init: 5
    min_update: 5
    max: 50
  residual:
    sigma_num: 3.0
    max_radius: 3.0
  search:
    neighborhood_size: 1
vio:
  enable: true  # set by test_*.sh
  ekf:
    # max_iterations/min_diff_error matched to FAST-LIVO2 myvio's own
    # production values (10 / 0.0001, both HILTI/NTU_VIRAL configs) on
    # 2026-08-15 -- see VIO_METHODOLOGY_DIFF.md's cross-codebase comparison.
    # Previously 50 / 1.0e-3 (5x more iterations allowed, a 10x looser
    # relative-improvement stop).
    max_iterations: 5
    min_norm_dtheta: 0.0  # never activates by default -- see VioProcOptions::min_norm_dtheta's doc comment
    min_norm_dt: 0.0      # never activates by default -- see VioProcOptions::min_norm_dt's doc comment
    min_diff_error: 1.0e-4
    max_avg_error: 5.0  # reject (roll back) the whole frame if the best fit is still worse than this
    anchor_split_depth: 0.0  # pos_/neg_epipolar_residual_var split threshold -- see that option's doc comment
    distortion_weight_on: false  # rigorous per-point distortion weighting -- see that option's doc comment
    weight_pixel_noise_px: 0.5   # only consulted when distortion_weight_on is true
combined:
  # Opt-in joint LIO+VIO EKF step (default off -- see combined_processing.h).
  # Requires vio/enable: true too (see livo_recon_node.cpp's loadParameters()
  # doc comment) for the tracker backend to actually load.
  enable: false
  max_iterations: 5
  ekf:
    min_norm_dtheta: 0.0
    min_norm_dt: 0.0
    min_diff_error: -1.0
    max_avg_error: 5.0
tracker:
  backend: "cotracker"  # set by test_*.sh
  device: "cuda"
  tracker_format: "jit"  # "jit" (default), "aot" (AOTInductor, fp16), or "aot_fp32" (AOTInductor, full precision) -- cotracker only, see Tracker::loadParameters. AOT packages must match grid_selection/grid_rows x grid_cols (filename-encoded query count).
  grid_selection:
    grid_rows: 16
    grid_cols: 16  # set by test_*.sh
  reseed:
    active_fraction: 0.9  # reseed the whole tracked-point grid once fewer than this fraction stay visible -- ignored by the cotracker backend, which always reseeds
    min_candidate_fraction: 0.25  # fraction of grid_rows*grid_cols selectAnchors must find a candidate for before a reseed is actually committed to. NOTE: the achievable fraction under healthy conditions drops as grid_rows*grid_cols grows -- retune lower when increasing grid resolution
  track_cache_path: ""  # path to a .rlivtrackcache file (src/tools/cache_tracker_output.cpp). Empty (default) = live tracking. When set, skips the GPU tracker pass entirely and replays cached TrackedFrame records by timestamp -- see TrackerOptions::track_cache_path's doc comment.
common:
  offline_bag_path: ""       # path to a bag to read directly in-process (no rosbag play, no ROS transport) instead of via live subscribers. Empty = live mode (run()), unchanged.
  offline_duration_secs: -1.0  # caps runOffline() to the first N seconds (bag-relative). <= 0 = no cap, process the whole bag.
evo:
  enable: false
  gt_source: "topic"  # "topic" or "file"
  gt_topic: "/leica/pose/relative"
  gt_file: ""  # TUM-format path, used when gt_source == "file"
  queue_size: 2000
  max_time_diff: 0.25  # seconds; matches fastlivo_evo.py's own EVO_MAX_TIME_DIFF (CQ-65 fix --
  # see EvoProcOptions::max_time_diff's doc comment; the old 0.05 sat at NTU_VIRAL's own
  # frame-spacing edge and rejected ~53% of otherwise-good GT matches there)
  rpe:
    compute_rte: false  # relative translation error (RPE's translation part) -- topic mode only
    compute_roe: false  # relative rotation error (RPE's rotation part) -- topic mode only; a diagnostic curiosity against position-only ground truth, not a true orientation error (see evo_processing.cpp's logStage())
    delta_s: 1.0         # seconds between the pose pair RTE/ROE compare
topics:
  # 2026-10-20: fixed from /ximea_cam/image_out -- every real mid360 bag (calibration and the
  # 4 new captures) publishes the camera on /ximea_cam/image_raw; image_out was never produced.
  image: "/ximea_cam/image_raw"
  lidar: "/livox/lidar"
  imu: "/livox/imu"
  queue_size: 20000
extrinsics:
  R_l2i: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  t_l2i: [0., 0., 0.]
  # 2026-10-20: direct_visual_lidar_calibration (calib_10_20_pc2.bag). Its own calib.json saves
  # results.T_lidar_camera (p_lidar = T_lidar_camera * p_camera, i.e. camera-to-lidar); R_l2c/t_l2c
  # here is the opposite direction (p_camera = R_l2c * p_lidar + t_l2c), so this is that result's
  # INVERSE, not a direct copy of calib.json's own numbers.
  R_l2c: [-0.000508, -0.999989, -0.004629, -0.022352, 0.004639, -0.999739, 0.999750, -0.000404, -0.022354]
  t_l2c: [0.063469, -0.016757, -0.035479]
camera:
  width: 2048
  height: 2048
  fx: 2234.8900949301365
  fy: 2240.9754561513673
  cx: 1024.0
  cy: 1024.0
  distortion_coeffs: [-0.2051169263683994, 0.096234768611292015, 0.00030620867113155477, -0.00085412363674615063, 0.0]
cbk:
  lidar:
    type: mid360   # avia | mid360 | pcl
    blind: 0.5
    point_filter_num: 1  # 2026-10-20: Bryce's explicit call
  imu:
    acc_type: "g"  # this device's IMU reports linear_acceleration in units of gravity, not m/s^2
    gyr_type: "rad_s"
