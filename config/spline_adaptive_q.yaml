# Scan-spline trajectory + live process-noise estimation.
#
# STRUCTURE IS THE CONTRACT.  Every block below whose key set is nested is
# nested because the code nests it: a key inside a scope whose mode does not
# select it is not merely ignored, the node REFUSES to start.  Modes are
# validated against a named set, so a typo fails rather than selecting an
# ablation arm.  What the run prints at startup is the EFFECTIVE
# configuration, which is the cell's real identity -- parse that, not this.
#
# See include/livo_recon/utils/log/config_resolve.h for why this shape exists
# and what it cost to learn.

spline:
  # THE ONE MODE KNOB.  Bryce, 2026-09-06.
  #
  #   raw_imu        No spline.  Points are deskewed ONCE, before the first
  #                  IEKF iteration, from the IMU-propagated poses.  Every
  #                  other spline/* key AND the whole adaptive_q block are
  #                  REFUSED at startup -- the Q statistic IS the
  #                  spline-vs-IMU residual, so it has nothing to read.
  #   spline         Fitted once per frame with BOTH endpoints clamped, and
  #                  the points re-deskewed against it every IEKF iteration.
  #   spline+refine  As above, and each iteration the interior shape is
  #                  refined against the SAME residuals the IEKF solves
  #                  from -- so both are linearised at one trajectory.
  #
  # This replaces spline/enable, spline/per_iteration (five values) and
  # spline/boundary_anchor_mode (three).  Thirty nominal combinations
  # carrying five behaviours; SP-4a"/4b" spent half a 276-job grid landing
  # on ATE-identical duplicates before that was noticed.
  mode: spline

  control_points:
    # THE ONLY control-point knob.  n_cp is derived from this rate and the
    # scan's own duration, so the axis is comparable across sequences -- a
    # fixed n_cp is a different control rate on every bag.
    #
    # 100 Hz against a 200 Hz IMU.  Both endpoints are clamped, which spends
    # SIX control points (three per end), so free interior shape is n_cp - 6:
    # at a 10 Hz scan this gives n_cp = 13 and 7 free.  Below ~70 Hz the
    # interior has fewer than 4 free points and the shape is dictated by the
    # clamps.  fit() also floors n_cp at 7 and the sample count caps it near
    # 19 at 10 Hz scan / 200 Hz IMU.
    hz: 100.0

  # Live only under mode: spline+refine.
  # refine:
  #   iters: 1

  log_en: true

# Nested under spline/mode in the resolver, not merely warned about --
# and REFUSED outright at mode: raw_imu, where the spline-vs-IMU
# residual this estimator reads does not exist.
adaptive_q:
  enable: true
  # Bounded excursion.  0.3 is +/- 2x; AI-IMU's own 3 (+/- 1000x) is far too
  # wide given what the alpha ladders found.
  beta_acc: 0.3
  beta_gyr: 0.3
  # Per-frame rate limit on z.  0.02 at 10 Hz needs ~34 frames past warmup to
  # reach even a 1.5x excursion -- read the engagement report before calling
  # this "adapted".
  z_rate_limit: 0.02
  # Whiteness gate: refuse the measurement if |lag-1 ACF| exceeds this.
  acf1_max: 0.35
  warmup_frames: 20
  ema: 0.9
  bounds:
    max_ratio: 100.0
    min_ratio: 0.01
  noise_floor:
    # MODE: "allan" | "off".  "allan" bounds the applied variance below by the
    # calibration window's own measured noise floor.
    mode: allan
    # Live under mode: allan.  1.0 is the raw physical floor.
    scale: 1.0
  log_en: true

voxel_map:
  plane:
    weight_floor:
      # MODE: "sensor_range" | "incidence" | "constant" | "none".
      #
      # The along-normal residual variance is built from a real range/bearing
      # model, and a flat literal 1e-3 = (3.2 cm)^2 used to be added on top of
      # it.  Whether that dominated was pure geometry: it swamped short-range
      # oblique returns, which is why 2-3% of correspondences were floored on
      # eee_01 (outdoor, long range) against 55-70% on exp05 (indoor
      # construction).  On HILTI the majority of the update was weighted by a
      # constant, and every plane-confidence mechanism acting through the
      # weight had almost nothing to act on.
      #
      # "sensor_range" (default) floors at sigma_r^2, mirrored from
      # imu/sensor/range_err -- the constant, tuned by the physics rather than
      # guessed, and per-dataset for free.  "incidence" replaces the floor
      # with sigma_r^2 (cos^2 + k sin^2), modelling range noise DEGRADING with
      # incidence rather than projecting to zero; k = 1 is identical to
      # sensor_range, so k is the ablation.  "constant" and "none" are the two
      # controls for queue row W-1.
      # "legacy" is the fifth value and it is the REPRODUCIBILITY CONTROL,
      # not a setting: the historical code had NO floor in the gate and 1e-3
      # in the weight, so none of the four principled modes reproduces it --
      # "constant" isolates the gate change, "none" isolates the weight
      # change, and neither is the old pair.  V-2's byte-identity check had
      # nothing to run against until this existed.  Do not ship it.
      mode: sensor_range
      # constant: 1.0e-3      # live under mode: constant OR legacy
      # incidence_k: 1.0      # live under mode: incidence
